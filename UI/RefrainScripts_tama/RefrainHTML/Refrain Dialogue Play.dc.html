<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#16131d;}
  @keyframes caretB{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:.2;transform:translateY(2px)}}
  @keyframes orbF{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes softP{0%,100%{opacity:.85}50%{opacity:1}}
  @keyframes chIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
</style>
</helmet>

<div style="min-height:100vh;background:radial-gradient(120% 80% at 50% -10%,#221b30 0%,#16131d 55%,#100d16 100%);padding:48px 32px 72px;display:flex;flex-direction:column;align-items:center;gap:24px;font-family:'Noto Sans JP',sans-serif;color:#fff;">

  <header style="width:1280px;max-width:100%;display:flex;flex-direction:column;gap:10px;">
    <div style="font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.32em;color:#8a7a9a;text-transform:uppercase;">algo: Refrain of Light — Dialogue Player（動作版）</div>
    <h1 style="margin:0;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:30px;line-height:1.1;">会話システム — タイプライター・選択肢・AUTO/SKIP/ログ</h1>
    <p style="margin:2px 0 0;color:#c8b8d8;font-size:14px;max-width:820px;line-height:1.6;"><strong style="color:#fff;">クリックで送り</strong>（タイプ中は全文表示）。<strong style="color:#fff;">選択肢</strong>をクリックで分岐。右上の <strong style="color:#a6dcec;">AUTO</strong>（自動送り）/ <strong style="color:#a6dcec;">SKIP</strong>（早送り）/ <strong style="color:#a6dcec;">ログ</strong>（既読履歴）。</p>
  </header>

  <section style="width:1280px;max-width:100%;" data-screen-label="会話プレイヤー">
    <div style="position:relative;width:1280px;height:720px;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.1);box-shadow:0 24px 60px rgba(0,0,0,.55);">
      <!-- static backdrop -->
      <div style="position:absolute;inset:0;background:radial-gradient(66% 60% at 60% 8%,rgba(120,150,210,.2),transparent 60%),radial-gradient(50% 50% at 18% 92%,rgba(154,114,217,.16),transparent 65%),linear-gradient(180deg,#0e1834 0%,#0a1126 55%,#070a16 100%);"></div>
      <div style="position:absolute;inset:0;background:linear-gradient(115deg,transparent 32%,rgba(150,180,230,.06) 48%,transparent 62%);"></div>
      <span style="position:absolute;left:13%;top:24%;font-family:'Zen Kaku Gothic New';font-weight:500;font-size:20px;color:rgba(200,184,216,.12);transform:rotate(-4deg);white-space:nowrap;">あたしのせいだ</span>
      <span style="position:absolute;left:74%;top:30%;font-family:'Zen Kaku Gothic New';font-weight:500;font-size:18px;color:rgba(200,184,216,.1);white-space:nowrap;">とどかない</span>
      <span style="position:absolute;left:40%;top:18%;font-family:'Zen Kaku Gothic New';font-weight:500;font-size:16px;color:rgba(200,184,216,.09);white-space:nowrap;">きえたい</span>
      <div style="position:absolute;left:47%;top:32%;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#c9b6ef 55%,#9a72d9);box-shadow:0 0 16px rgba(154,114,217,.8);animation:orbF 5s ease-in-out infinite;"></div>
      <div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;opacity:.45;pointer-events:none;"></div>
      <div style="position:absolute;inset:0;box-shadow:inset 0 0 140px 46px rgba(0,0,0,.55);pointer-events:none;"></div>

      <!-- dynamic UI -->
      {{ overlay }}
    </div>
  </section>

  <footer style="width:1280px;max-width:100%;color:#6b6478;font-size:12px;border-top:1px solid rgba(255,255,255,.07);padding-top:18px;line-height:1.6;">
    Pattern B（シネマ下部バー）ベース。タイプ速度はSKIPで即時化＋高速送り、AUTOは全文表示後に自動で次へ。名前下線＝キャラ別色。選択肢は分岐し、合流後に共通ルートへ。最後はデモとして先頭へループ。
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { i:0, n:0, done:false, auto:false, skip:false, log:false, history:[] };

  css(s){ if(typeof s!=='string') return s; const o={}; s.split(';').forEach(d=>{ const t=d.trim(); if(!t) return; const i=t.indexOf(':'); if(i<0) return; const k=t.slice(0,i).trim().replace(/-([a-z])/g,(_,c)=>c.toUpperCase()); o[k]=t.slice(i+1).trim(); }); return o; }
  E(tag,props){ const a=[].slice.call(arguments); if(props&&props.style){ a[1]=Object.assign({},props,{style:this.css(props.style)}); } return React.createElement.apply(React,a); }

  CH(){ return {
    boy:{name:'少年',color:'#6cbcd8',t1:'rgba(150,180,230,.85)',t2:'rgba(120,150,210,.55)',role:'BOY'},
    mina:{name:'ミナ',color:'#9a72d9',t1:'rgba(201,182,239,.9)',t2:'rgba(154,114,217,.55)',role:'MAID'},
    akari:{name:'あかり',color:'#e072ac',t1:'rgba(240,168,207,.9)',t2:'rgba(224,114,172,.55)',sub:'「ゆるせないわたし」'},
  };}

  script(){
    return [
      {type:'narr', text:'放課後の教室。だれもいない。窓の外で、雨の音だけが続いている。'},
      {type:'line', who:'boy', text:'飛んでくるのは、この人を苦しめてる&ldquo;言葉&rdquo;だ。本人じゃない。撃って祓っていい。'},
      {type:'line', who:'mina', text:'……わたくしが、受け止めます。あなたは、まっすぐ前だけを。'},
      {type:'line', who:'boy', text:'無理すんなよ。……お前が壊れたら、意味ないだろ。'},
      {type:'choice', text:'——どうする？', opts:[ {l:'ミナを信じて任せる', g:5}, {l:'自分が前に出る', g:6} ]},
      {type:'line', who:'mina', text:'ありがとう、ございます。……では、いきます。', next:7},
      {type:'line', who:'boy', text:'……俺が壊す。お前は下がってろ。', next:7},
      {type:'line', who:'akari', text:'……なんで、来たの。もう、ほっといてよ。'},
      {type:'narr', text:'彼女の声は、降りやまない雨の音に溶けていった。'},
      {type:'plain', text:'———— おわり（デモ）。クリックで最初に戻ります。', next:0},
    ];
  }

  componentDidMount(){ this.wait=0; this.timer=setInterval(()=>this.tick(),28); }
  componentWillUnmount(){ clearInterval(this.timer); }

  cur(){ return this.script()[this.state.i]; }

  tick(){
    const node=this.cur();
    if(!node || node.type==='choice') return;
    const len=node.text.length;
    if(!this.state.done){
      const step=this.state.skip?len:1;
      const n=Math.min(len,this.state.n+step);
      const done=n>=len;
      this.wait=0;
      this.setState({n,done});
    } else if(this.state.auto||this.state.skip){
      this.wait+=28;
      const need=this.state.skip?140:1200;
      if(this.wait>=need){ this.wait=0; this.advance(); }
    }
  }

  pushLog(node){
    if(!node) return;
    const ch=node.type==='line'?this.CH()[node.who]:null;
    this.setState(s=>({history:s.history.concat([{ name: ch?ch.name:(node.type==='narr'?'ナレーション':''), color: ch?ch.color:'#8a7a9a', text:node.text }])}));
  }

  advance(){
    const node=this.cur();
    this.pushLog(node);
    let nx = (node && node.next!=null)? node.next : this.state.i+1;
    if(nx>=this.script().length) nx=0;
    this.wait=0;
    this.setState({i:nx,n:0,done:false});
  }

  click(){
    const node=this.cur();
    if(!node || node.type==='choice') return;
    if(!this.state.done){ this.setState({n:node.text.length,done:true}); }
    else { this.advance(); }
  }

  choose(opt){
    const node=this.cur();
    this.setState(s=>({history:s.history.concat([{name:'選択',color:'#a6dcec',text:'▷ '+opt.l}])}));
    this.wait=0;
    this.setState({i:opt.g,n:0,done:false});
  }

  avatar(ch){
    const e=this.E.bind(this);
    return e('div',{style:`position:absolute;left:36px;bottom:28px;width:100px;height:100px;border-radius:50%;background:linear-gradient(180deg,rgba(40,40,64,.7),rgba(18,18,32,.5));border:2px solid ${ch.color};box-shadow:0 0 18px ${ch.color}66;overflow:hidden;`},[
      e('div',{key:'h',style:`position:absolute;left:50%;top:22px;transform:translateX(-50%);width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 45% 40%,${ch.t1},transparent 72%);`}),
      e('div',{key:'b',style:`position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);width:96px;height:96px;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,${ch.t2},transparent 68%);`})
    ]);
  }

  caret(color){ return this.E('span',{style:`position:absolute;right:34px;bottom:22px;font-size:16px;color:${color};animation:caretB 1.1s ease-in-out infinite;`},'▼'); }

  buildBar(node){
    const e=this.E.bind(this);
    const txt=node.text.slice(0,this.state.n);
    const done=this.state.done;
    if(node.type==='narr'){
      return e('div',{key:'bar',style:'position:absolute;left:0;right:0;bottom:0;top:0;pointer-events:none;'},[
        e('div',{key:'tb',style:'position:absolute;left:0;right:0;top:0;height:84px;background:linear-gradient(180deg,rgba(6,6,12,.92),rgba(6,6,12,0));'}),
        e('div',{key:'bb',style:'position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(0deg,rgba(6,6,12,.95),rgba(6,6,12,0));'}),
        e('div',{key:'tx',style:'position:absolute;left:90px;right:90px;bottom:64px;text-align:center;'},
          e('p',{style:'margin:0;font-family:\'Zen Kaku Gothic New\';font-weight:400;font-style:italic;font-size:23px;line-height:1.6;color:#cdc4dc;letter-spacing:.05em;'},[txt, done?e('span',{key:'c',style:'color:#a6dcec;animation:caretB 1.1s ease-in-out infinite;margin-left:6px;'},'▼'):null]))
      ]);
    }
    // line / plain bar
    const ch = node.type==='line'? this.CH()[node.who] : null;
    const kids=[];
    if(ch) kids.push(React.cloneElement(this.avatar(ch),{key:'av'}));
    const bodyLeft = ch? '166px':'40px';
    const inner=[];
    if(ch){
      const nameRow=[ e('span',{key:'n',style:`white-space:nowrap;font-family:'Zen Kaku Gothic New';font-weight:900;font-size:20px;color:#fff;letter-spacing:.04em;`},ch.name) ];
      if(ch.role) nameRow.push(e('span',{key:'r',style:`font-family:'JetBrains Mono';font-size:11px;color:${ch.color};letter-spacing:.1em;`},ch.role));
      if(ch.sub) nameRow.push(e('span',{key:'s',style:`white-space:nowrap;font-family:'Zen Kaku Gothic New';font-size:12px;color:${ch.color};`},ch.sub));
      inner.push(e('div',{key:'nm',style:`display:inline-flex;align-items:center;gap:10px;border-bottom:2px solid ${ch.color};padding-bottom:5px;margin-bottom:13px;`},nameRow));
    }
    inner.push(e('p',{key:'p',style:'margin:0;font-family:\'Zen Kaku Gothic New\';font-weight:500;font-size:25px;line-height:1.5;color:#eef1f6;'},txt));
    kids.push(e('div',{key:'bd',style:`position:absolute;left:${bodyLeft};right:50px;bottom:32px;`},inner));
    if(done) kids.push(React.cloneElement(this.caret(ch?ch.color:'#6cbcd8'),{key:'cr'}));
    const accent = ch? ch.color : 'rgba(108,188,216,.6)';
    return e('div',{key:'bar',style:`position:absolute;left:0;right:0;bottom:0;height:172px;background:linear-gradient(180deg,rgba(8,10,20,0),rgba(8,10,20,.84) 34%,rgba(8,10,20,.97));border-top:1px solid ${accent}55;`},kids);
  }

  buildChoices(node){
    const e=this.E.bind(this);
    const btns=node.opts.map((o,i)=>e('div',{key:i,onClick:(ev)=>{ev.stopPropagation();this.choose(o);},style:`min-width:420px;display:flex;align-items:center;gap:12px;justify-content:center;padding:16px 26px;border-radius:13px;cursor:pointer;background:rgba(16,18,30,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(159,222,245,.35);box-shadow:0 10px 28px rgba(0,0,0,.5);font-family:'Zen Kaku Gothic New';font-weight:700;font-size:20px;color:#eaf4fb;animation:chIn .3s ease-out ${(i*0.06).toFixed(2)}s both;`,'style-hover':'border:1px solid rgba(159,222,245,.9);background:rgba(24,34,48,.9);'},[
      e('span',{key:'d',style:'width:8px;height:8px;border-radius:50%;background:#6cbcd8;box-shadow:0 0 10px #6cbcd8;flex:none;'}),
      o.l
    ]));
    return e('div',{key:'ch',style:'position:absolute;left:0;right:0;bottom:150px;display:flex;flex-direction:column;align-items:center;gap:14px;',onClick:(ev)=>ev.stopPropagation()},[
      e('div',{key:'q',style:'font-family:\'Zen Kaku Gothic New\';font-weight:700;font-size:16px;color:#a6dcec;letter-spacing:.08em;margin-bottom:2px;text-shadow:0 2px 8px rgba(0,0,0,.6);'},node.text),
      ...btns
    ]);
  }

  ctlBtn(label,active,onClick,key){
    const e=this.E.bind(this);
    return e('div',{key:key,onClick:(ev)=>{ev.stopPropagation();onClick();},style:`display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:9px;cursor:pointer;font-family:'JetBrains Mono';font-weight:800;font-size:12px;letter-spacing:.12em;transition:all .15s;${active?'background:rgba(108,188,216,.2);border:1px solid rgba(159,222,245,.75);color:#d7f3ff;box-shadow:0 0 14px rgba(108,188,216,.35);':'background:rgba(16,16,28,.6);border:1px solid rgba(255,255,255,.14);color:#b9b2c8;'}`,'style-hover':'border:1px solid rgba(159,222,245,.6);color:#fff;'},label);
  }

  buildControls(){
    const e=this.E.bind(this);
    return e('div',{key:'ctl',style:'position:absolute;right:22px;top:20px;display:flex;gap:9px;',onClick:(ev)=>ev.stopPropagation()},[
      this.ctlBtn('AUTO',this.state.auto,()=>this.setState(s=>({auto:!s.auto,skip:false})),'a'),
      this.ctlBtn('SKIP',this.state.skip,()=>this.setState(s=>({skip:!s.skip,auto:false})),'s'),
      this.ctlBtn('ログ',this.state.log,()=>this.setState(s=>({log:!s.log})),'l'),
    ]);
  }

  buildLog(){
    const e=this.E.bind(this);
    const rows=this.state.history.length? this.state.history.map((h,i)=>e('div',{key:i,style:'display:flex;gap:14px;padding:11px 4px;border-bottom:1px solid rgba(255,255,255,.06);'},[
      e('span',{key:'n',style:`flex:none;width:88px;text-align:right;font-family:'Zen Kaku Gothic New';font-weight:700;font-size:14px;color:${h.color};`},h.name),
      e('span',{key:'t',style:'flex:1;font-family:\'Zen Kaku Gothic New\';font-size:15px;line-height:1.55;color:#d8cfe6;'},h.text)
    ])) : [e('div',{key:'e',style:'padding:30px;text-align:center;color:#6b6478;font-family:\'Zen Kaku Gothic New\';'},'まだ履歴はありません。')];
    return e('div',{key:'log',onClick:()=>this.setState({log:false}),style:'position:absolute;inset:0;z-index:50;background:rgba(6,5,12,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;'},
      e('div',{onClick:(ev)=>ev.stopPropagation(),style:'width:820px;max-height:560px;display:flex;flex-direction:column;background:rgba(18,16,28,.96);border:1px solid rgba(255,255,255,.12);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.6);overflow:hidden;'},[
        e('div',{key:'h',style:'display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid rgba(255,255,255,.1);'},[
          e('span',{key:'t',style:'font-family:\'Zen Kaku Gothic New\';font-weight:900;font-size:18px;color:#fff;'},'ログ'),
          e('span',{key:'s',style:'font-family:\'JetBrains Mono\';font-size:10px;letter-spacing:.2em;color:#6b6478;'},'BACKLOG'),
          e('div',{key:'c',onClick:()=>this.setState({log:false}),style:'margin-left:auto;display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-family:\'Zen Kaku Gothic New\';font-size:13px;color:#c8b8d8;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:7px 15px;'},'閉じる ✕')
        ]),
        e('div',{key:'b',style:'flex:1;overflow-y:auto;padding:8px 22px 18px;'},rows)
      ]));
  }

  renderVals(){
    const e=this.E.bind(this);
    const node=this.cur();
    const layers=[];
    if(node && node.type!=='choice'){
      layers.push(e('div',{key:'catch',onClick:()=>this.click(),style:'position:absolute;inset:0;cursor:pointer;'}));
    }
    layers.push(this.buildBar(node));
    if(node && node.type==='choice') layers.push(this.buildChoices(node));
    layers.push(this.buildControls());
    if(this.state.log) layers.push(this.buildLog());
    return { overlay: e('div',{style:'position:absolute;inset:0;'},layers) };
  }
}
</script>
</body>
</html>
