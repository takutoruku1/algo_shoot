; ============================================================================
; credits.ini — ゲーム内クレジット画面（src/Credits.cs）の表示データ
; ----------------------------------------------------------------------------
; ・ゲーム起動時に一度だけ読み込む（変更したらゲームを再起動）。
; ・Godot の ConfigFile ではなく行単位の独自書式（引用符・キー名は不要）:
;     [見出し — HEADING]  … セクション見出し（— の右は英字サブ表記・省略可）
;     テキスト             … 1行がそのまま1行で表示される
;     > テキスト           … 補足行（小さく薄く表示。規約URL・ライセンス種別など）
;     ; か # で始まる行    … コメント（表示されない）
; ・読み込みチェーン（後勝ち・ファイル単位で丸ごと差し替え）:
;     1) res://config/credits.ini（このファイル＝既定。エクスポート同梱）
;     2) エディタ実行時: プロジェクトルート直下の credits.ini（あれば）
;     3) exe と同じフォルダの credits.ini（配布後の表記修正に「置くだけ」で対応）
; ・BGM を差し替えたら、BGM/acquisition_list.md §6 の取得記録から
;     曲名 — 作者（サイト名）
;     > 規約URL（DL日）
;   を [音楽] セクションへ足すだけでよい（コード変更不要）。
;   クレジット表記義務のあるサイト（魔王魂・MusMus・PeriTune 等）は各サイトの指定書式を優先する。
; ============================================================================

