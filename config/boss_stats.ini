; ============================================================================
; boss_stats.ini — ボスのバランス調整値（開発メンバー向け）
; ----------------------------------------------------------------------------
; ・ゲーム起動時に一度だけ読み込む（変更したらゲームを再起動）。
; ・読み込みチェーン（後勝ち）:
;     1) res://config/boss_stats.ini（このファイル＝既定）
;     2) エディタ実行時: プロジェクトルート直下の boss_stats.ini（あれば）
;     3) exe と同じフォルダの boss_stats.ini（配布ビルドに置くだけで上書き）
; ・キーを消しても壊れない（コード内の既定値＝ここに書いてある現行値で動く）。
; ・値の型: 小数キーは int 表記でも可（8 → 8.0）。bool は true/false（0/1 も可）。
; ・弾の間隔(interval)には難易度倍率 Di（Easy2.1/Normal1.35/Hard1.0/Luna0.85）、
;   弾数(count)には Dn（Easy0.38/Normal0.7/Hard1.1/Luna1.9）が掛かる＝ここは「基準値」。
; ・弾速(px/s)には難易度倍率 BulletSpeedMul（Easy0.62/Normal0.85/Hard1.05/Luna1.18）が掛かる。
; ============================================================================

; ─────────────────────────────────────────────
; STAGE3 レイ（順位掲示板）
; ─────────────────────────────────────────────
[rei]
points = 1500          ; 浄化スコア
body_radius = 9.0      ; 本体の当たり半径(px)
body_display_h = 72.0    ; 本体スプライトの表示高(px)。v3 の本体絵はエフェクトを含まないので旧52だと小さく見える（自機36pxの約2倍）
panel_count = 5        ; 周回パネル（黒い吹き出し）枚数
panel_ink = 2          ; パネル1枚の耐久（剥がすのに要する被弾数）
orbit_radius = 26.0    ; パネル周回半径(px)
spin_speed = 0.9       ; パネル周回速度(rad/s)
bullet_speed = 82.0    ; 基準弾速(px/s)＝EnemyBulletSpeed
hp_bars = 0            ; HPバー本数の上書き（0=難易度既定 Easy2/Normal4/Hard5/Luna6）
roam_speed = 42.0      ; 徘徊速度(px/s)

ring_interval = 1.0    ; パターン0: リング弾の間隔(s・基準)
ring_count = 14        ; パターン0: リング弾数（基準。「また逃げる」圧 +pressure が加算）
ring_speed = 70.0      ; パターン0: リング弾速(px/s)
ring2_interval = 1.1   ; パターン1: リング弾の間隔(s・基準)
ring2_count = 18       ; パターン1: リング弾数（基準）
ring2_speed = 76.0     ; パターン1: リング弾速(px/s)
aimed_interval = 0.7   ; パターン2: 自機狙い扇の間隔(s・基準)
aimed_speed = 98.0     ; パターン2: 自機狙い弾速(px/s)。way数は圧依存(3→5→7way)のため固定
spiral_interval = 0.085 ; パターン3: スパイラルの間隔(s・基準)
spiral_speed = 90.0    ; パターン3: スパイラル弾速(px/s)

pressure_delay = 6.0   ; 「また逃げる」圧: 与ダメゼロ許容時間(s)＝これを超えると+1段
pressure_step = 4.0    ; 「また逃げる」圧: 2段階目までの追加時間(s)
pressure_max = 2       ; 「また逃げる」圧: 最大段数（リング弾数と扇way数に乗る）

relay_hp = 0.26        ; 安置リレー「最終選考」の発動HP割合（0.26=残26%で一度だけ）

aoe_interval = 8.0     ; 範囲技（テレグラフ）の宣告間隔(s)
aoe_warn_min = 1.1     ; 予兆時間の下限(s)（難易度倍率 WarnMul が掛かる）
aoe_warn_max = 1.6     ; 予兆時間の上限(s)
aoe_anchor_player = true ; 各ボレーの1枚目を自機の現在地に置く（左端張り付き対策）

