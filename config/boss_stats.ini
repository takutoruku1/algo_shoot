goto_hp = 0.26         ; 「五徳の十字火」の発動HP割合（残26%＝第4スペル切替と同じ被弾で一度だけ）。
                       ; 旧0.28は切替26%と 4HP（Easy）しか離れておらず、無防備窓（4秒・上限100HP・0.05秒間隔）の中では
                       ; 宣言カード「自分なにしてんだろ」が1〜2ヒットで第4スペル／フィナーレのカードに上書きされていた。
                       ; 値を離しても解決しない（0.34→Easy 16HP≒窓内1秒、十字火は宣言→X着弾まで Easy 3.4秒。
                       ; 3.4秒ぶん＝窓内DPS16で54HP=27%を離すと meal_hp 0.52 を越え順序が崩れる）ため、
                       ; BossKoharu.OnHpChanged 側で「十字火の進行中はスペル切替とフィナーレの宣言を保留し、
                       ; X着弾のゲート解除で発火」に変えた。goto_hp は切替と同値にして「十字火→我に返る」を一拍にする。
                       ; 変更 2026-09-06（game-designer）。engineer が Easy/Normal でカード可視秒数を検証する。
finale_cap = 0.26      ; フィナーレ発動HPの上限。実装は min(0.5/本数, finale_cap) なので「上限」＝下げる方向にしか効かない。
                       ; Easy の式は 0.5/2=0.25 < 0.26 ＝ 現状この値は全難易度で不発（Easy の実効フィナーレは 25%=50HP）。
                       ; 第4スペル切替(26%)→フィナーレ(25%)は Easy で 2HP 差＝第4カードは最大1〜2ヒット分だけ見える。
                       ; 旧0.18は「Easyの第4スペル帯（26%→18%）を確保する」ためだったが、その帯は 16HP（--assist で約1秒）
                       ; しか無く読めない上に、フィナーレが 36HP に痩せて他3ボス（Easy 50HP）より 28% 短く、
                       ; 宣言カード5秒の内に撃破される走行が多かった。0.26＝第4スペル切替と同じ被弾で発火させ
                       ; （同フレームで宣言が上書き＝カードのチラつき無し）、Easyのフィナーレを 52HP に戻す。
                       ; レイ／あかりは Easy で式=25% に対し第4スペル26%（2HP差）＝事実上同じ「第4を畳んでフィナーレへ」の構造。
                       ; 変更 2026-09-06（game-designer）。engineer が Easy/Normal の宣言カード可視秒数を検証する。

