orbit_radius = 26.0    ; パネル周回半径(px)
spin_speed = 0.9       ; パネル周回速度(rad/s)
bullet_speed = 82.0    ; 基準弾速(px/s)＝EnemyBulletSpeed
hp_bars = 0            ; HPバー本数の上書き（0=難易度既定 Easy2/Normal4/Hard5/Luna6）
roam_speed = 42.0      ; 徘徊速度(px/s)。※移動は下の cruise_speed が優先（roam_speed はフォールバック）

; ── 移動（BossMover の状態機械＋立ち位置）［レイ＝配信の枠の中］
;   枠から出ない。横移動をほぼ捨て（stance_edge_x/track_w が小さい）、傾き（lean_max 大）で表情を作る。
;   cruise_speed  : 立ち位置へ向かうときの最高速(px/s)。無ければ roam_speed を使う
;   accel_time    : 速度の追従時定数(s)。大きいほど重い（効き始めが遅い）
;   hover_amp     : 待機中の縦の微揺れ(px)。0＝上下に揺れない
;   hover_freq    : 同・周波数
;   lean_max      : 進行方向への最大傾き(rad)。移動を捨てる相手ほど大きく＝傾きで演じる
;   stance_center_x / stance_y : 立ち位置の基準（リング系はここに据わる）
;   stance_edge_x : 壁・帯系で中心から端へ寄る距離(px)
;   stance_track_w: 自機狙いで自機を追える横幅(px)（中心±）
;   stance_track_gain : 自機 x をどれだけ鏡写しに追うか（1.0＝同じxに寄る）
;   stance_rise_y : 壁・大技で浮く量(px。負＝上)
;   stance_windup / stance_action / stance_recover : 構え／本動作／余韻の尺(s)
;   stance_back / stance_push : 構えで引く量／本動作で出る量(px)
;   stance_settle : 立ち位置に着いてからの「一拍」(s)
