<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Refrain | エビデンス</title>
  <style nonce="__NONCE__">
    :root { font-family: system-ui, sans-serif; color: #edf1f7; background: #10151f; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1120px; margin: auto; padding: 28px 16px 64px; }
    header { border-bottom: 1px solid #344052; padding-bottom: 22px; }
    .eyebrow { color: #93d9cd; letter-spacing: .15em; font-size: 12px; font-weight: 700; }
    h1 { margin: 8px 0; font-size: clamp(24px, 5vw, 34px); }
    p { line-height: 1.7; }
    .muted, .meta { color: #b3bdcc; }
    .notice { background: #1a2635; border-left: 3px solid #93d9cd; padding: 12px 16px; border-radius: 4px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0 12px; }
    input, select, button, .link { min-height: 44px; padding: 10px 13px; border-radius: 8px; border: 1px solid #435369; background: #1b2534; color: #edf1f7; font: inherit; }
    input { flex: 1; min-width: 160px; }
    button, select, .link { cursor: pointer; }
    a { color: #9be4d8; }
    :focus-visible { outline: 3px solid #9be4d8; outline-offset: 3px; }
    .count { font-size: 14px; min-height: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 20px; }
    article { border: 1px solid #344052; border-radius: 12px; overflow: hidden; background: #18212e; min-width: 0; }
    .media { background: #080c12; display: flex; justify-content: center; align-items: center; min-height: 100px; }
    img, video { display: block; width: 100%; max-height: 70vh; object-fit: contain; }
    .details { padding: 16px; }
    h2 { margin: 0 0 8px; font-size: 18px; overflow-wrap: anywhere; }
    .meta { font-size: 13px; overflow-wrap: anywhere; margin: 6px 0; }
    .note { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .link { display: inline-flex; align-items: center; text-decoration: none; }
    #more { display: block; margin: 24px auto; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">REFRAIN / EVIDENCE</div>
    <h1>スクリーンショットと動画</h1>
    <p class="muted">画像を拡大したり、動画を再生・シークして確認できます。</p>
  </header>
  <p id="message" class="notice" role="status">接続を確認しています…</p>
  <section id="viewer" hidden aria-label="エビデンス一覧">
    <div class="toolbar">
      <input id="search" type="search" placeholder="タイトル・ファイル名で検索" aria-label="検索">
      <select id="kind" aria-label="種類"><option value="all">すべて</option><option value="video">動画</option><option value="image">画像</option></select>
      <button id="refresh" type="button">更新</button>
    </div>
    <p id="count" class="count muted" aria-live="polite"></p>
    <div id="gallery" class="grid"></div>
    <button id="more" type="button" hidden>続きを表示</button>
    <p class="muted">PCと共有ツールが起動している間だけ閲覧できます。共有を再起動した場合は、チャットの新しいリンクを開いてください。</p>
  </section>
</main>
<script nonce="__NONCE__">
  const $ = id => document.getElementById(id);
  const message = $('message');
  let entries = [], limit = 12;
  const formatDate = value => new Date(value).toLocaleString('ja-JP');
  const formatSize = size => size < 1024 * 1024 ? (size / 1024).toFixed(0) + ' KB' : (size / 1024 / 1024).toFixed(1) + ' MB';
  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    return node;
  }
  function render() {
    const query = $('search').value.toLocaleLowerCase();
    const filtered = entries.filter(entry => ($('kind').value === 'all' || entry.type === $('kind').value) &&
      (entry.title + entry.name + entry.note).toLocaleLowerCase().includes(query));
    $('gallery').replaceChildren();
    for (const entry of filtered.slice(0, limit)) {
      const card = element('article');
      const media = element('div', 'media');
      const preview = document.createElement(entry.type === 'video' ? 'video' : 'img');
      preview.src = '/media/' + entry.id;
      if (entry.type === 'video') {
        preview.controls = true;
        preview.playsInline = true;
        preview.preload = 'none';
        preview.setAttribute('aria-label', entry.title);
        preview.addEventListener('play', () => document.querySelectorAll('video').forEach(other => { if (other !== preview) other.pause(); }));
      } else { preview.alt = entry.title; preview.loading = 'lazy'; }
      preview.addEventListener('error', () => {
        media.replaceChildren(element('p', 'notice', '表示できませんでした。接続を確認して「更新」を押してください。'));
      });
      media.append(preview);
      const details = element('div', 'details');
      details.append(element('h2', '', entry.title),
        element('p', 'meta', (entry.type === 'video' ? '動画' : '画像') + ' · ' + formatSize(entry.size)),
        element('p', 'meta', '元ファイル更新: ' + formatDate(entry.capturedAt)),
        element('p', 'meta', entry.name));
      if (entry.note) details.append(element('p', 'note', entry.note));
      const actions = element('div', 'actions');
      const view = element('a', 'link', entry.type === 'video' ? '動画を開く' : '画像を拡大');
      view.href = '/media/' + entry.id; view.target = '_blank'; view.rel = 'noopener noreferrer';
      const download = element('a', 'link', 'ダウンロード');
      download.href = '/download/' + entry.id;
      actions.append(view, download); details.append(actions); card.append(media, details); $('gallery').append(card);
    }
    $('count').textContent = filtered.length ? filtered.length + ' 件 / 新しい追加順' : '該当するエビデンスがありません。';
    $('more').hidden = filtered.length <= limit;
  }
  async function refresh() {
    $('refresh').disabled = true;
    try {
      const response = await fetch('/api/evidence', { cache: 'no-store' });
      if (response.status === 401) {
        $('viewer').hidden = true;
        message.hidden = false;
        message.textContent = 'チャットにある秘密リンクから開いてください。共有を再起動した場合は、新しいリンクが必要です。';
        return;
      }
      if (!response.ok) throw new Error();
      entries = await response.json();
      $('viewer').hidden = false;
      message.hidden = true;
      render();
    } catch {
      message.hidden = false;
      message.textContent = '接続できません。PCと共有ツールの起動を確認して、ページを再読み込みしてください。';
    } finally { $('refresh').disabled = false; }
  }
  $('search').addEventListener('input', () => { limit = 12; render(); });
  $('kind').addEventListener('change', () => { limit = 12; render(); });
  $('more').addEventListener('click', () => { limit += 12; render(); });
  $('refresh').addEventListener('click', refresh);
  (async () => {
    const token = new URLSearchParams(location.hash.slice(1)).get('token');
    history.replaceState(null, '', location.pathname);
    if (token) {
      try {
        const response = await fetch('/session', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) });
        if (!response.ok) throw new Error();
      } catch {
        message.textContent = 'リンクを認証できません。チャットの最新リンクから開き直してください。';
        return;
      }
    }
    await refresh();
  })();
</script>
</body>
</html>
